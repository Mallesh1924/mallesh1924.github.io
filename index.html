<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QOSSHY JOLY</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f5f5f2;
 font-family:Arial,sans-serif;
}
.hero{
 background:#111;
 color:white;
 text-align:center;
 padding:25px;
}
.logo{
 background:#ffb700;
 color:#111;
 width:75px;height:75px;
 margin:auto;
 border-radius:20px;
 display:grid;
 place-items:center;
 font-size:30px;
 font-weight:900;
}
.box{
 background:white;
 padding:18px;
 margin:12px auto;
 max-width:650px;
 border-radius:18px;
 box-shadow:0 4px 20px #0001;
}
input,select{
 width:100%;
 padding:14px;
 margin:7px 0;
 border:1px solid #ddd;
 border-radius:10px;
 font-size:16px;
}
button{
 width:100%;
 padding:15px;
 margin-top:9px;
 border:0;
 border-radius:12px;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}
.yellow{background:#ffb700;color:#111}
.green{background:#25d366;color:white}
.dark{background:#111;color:white}
.order{
 background:#111;
 color:white;
 padding:16px;
 border-radius:14px;
 margin:12px 0;
 border-left:5px solid #ffb700;
}
.order button{margin-top:8px}
.hidden{display:none}
.price{
 background:#111;
 color:#ffb700;
 padding:15px;
 text-align:center;
 font-size:25px;
 border-radius:12px;
}
</style>
</head>

<body>

<div class="hero">
 <div class="logo">QJ</div>
 <h1>QOSSHY <span style="color:#ffb700">JOLY</span></h1>
 <p>Қосшы такси қызметі</p>
</div>

<!-- КЛИЕНТ БЕТІ -->

<div id="clientView">

<div class="box">
<h3>🚕 Қайда барасыз?</h3>

<select id="from">
<option>Қосшы</option>
<option>Лесная Поляна</option>
<option>Тайтөбе</option>
<option>Астана</option>
</select>

<select id="to">
<option>Астана - Есіл</option>
<option>Астана - Мега</option>
<option>Астана - Хан Шатыр</option>
<option>Астана - Нұрлы Жол</option>
<option>Қосшы</option>
</select>

<select id="persons">
<option value="1">1 адам</option>
<option value="2">2 адам</option>
<option value="3">3 адам</option>
<option value="4">4 адам</option>
</select>

<select id="pay">
<option>Қолма-қол</option>
<option>Kaspi</option>
</select>

<input id="phone" placeholder="Телефон нөміріңіз"
type="tel">

<input id="price" type="number" value="1500">

<div class="price">
<span id="showPrice">1500 тг</span>
</div>

<button class="green" onclick="sendOrder()">
🚕 ТАКСИ ШАҚЫРУ
</button>

<p id="clientStatus"></p>

<div id="tracking" class="hidden">
<h3 id="trackingTitle">⏳ Жүргізуші ізделуде</h3>
<p id="trackingInfo"></p>
<a id="driverCall"></a>
</div>

</div>
</div>

<!-- ЖҮРГІЗУШІ БЕТІ -->

<div id="driverView" class="hidden">

<div class="box">
<h3>👨‍✈️ ЖҮРГІЗУШІ БӨЛІМІ</h3>

<input id="driverEmail" placeholder="Email">
<input id="driverPassword" type="password"
placeholder="Пароль">

<button class="yellow" onclick="loginDriver()">
КІРУ
</button>

<button class="dark" onclick="logoutDriver()">
Шығу
</button>
<p id="driverStatus"></p>
</div>

<div class="box hidden" id="driverPanel">
<h3>📋 ЖАҢА ТАПСЫРЫСТАР</h3>
<div id="orders"></div>
</div>

</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
getDatabase,ref,push,onValue,update,
serverTimestamp,runTransaction
}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

import {
getAuth,signInWithEmailAndPassword,signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

// ==================================
// FIREBASE БАПТАУЛАРЫҢДЫ ОСЫ ЖЕРГЕ ҚОЙ
// ==================================

const firebaseConfig = {
apiKey: "ОСЫ ЖЕРГЕ_API_KEY",
authDomain: "ОСЫ ЖЕРГЕ_AUTH_DOMAIN",
databaseURL: "ОСЫ ЖЕРГЕ_DATABASE_URL",
projectId: "ОСЫ ЖЕРГЕ_PROJECT_ID",
storageBucket: "ОСЫ ЖЕРГЕ_STORAGE_BUCKET",
messagingSenderId: "ОСЫ ЖЕРГЕ_SENDER_ID",
appId: "ОСЫ ЖЕРГЕ_APP_ID"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const auth=getAuth(app);

const ordersRef=ref(db,"orders");

const isDriver=
new URLSearchParams(location.search).has("driver");

if(isDriver){
document.getElementById("clientView").classList.add("hidden");
document.getElementById("driverView").classList.remove("hidden");
}

// ==================================
// КЛИЕНТ ТАПСЫРЫС БЕРУ
// ==================================

window.sendOrder=async function(){

const phone=document.getElementById("phone").value.trim();

if(phone.length<10){
alert("Телефон нөмірін дұрыс жазыңыз");
return;
}

const order={
from:document.getElementById("from").value,
to:document.getElementById("to").value,
phone:phone,
price:Number(document.getElementById("price").value),
persons:document.getElementById("persons").value,
pay:document.getElementById("pay").value,
status:"new",
createdAt:Date.now(),
driver:null
};

try{

const newOrder=push(ordersRef);

await update(ref(db,"orders/"+newOrder.key),{
...order,
createdAt:serverTimestamp()
});

localStorage.setItem("myOrder",newOrder.key);

document.getElementById("clientStatus").textContent=
"✅ Тапсырысыңыз қабылданды!";

document.getElementById("tracking").classList.remove("hidden");

listenClient(newOrder.key);

}catch(e){
alert("Қате: "+e.message);
}

};

// ==================================
// КЛИЕНТ ТАПСЫРЫСЫН БАҚЫЛАУ
// ==================================

function listenClient(id){

onValue(ref(db,"orders/"+id),snap=>{

if(!snap.exists())return;

const o=snap.val();

const title=document.getElementById("trackingTitle");
const info=document.getElementById("trackingInfo");
const call=document.getElementById("driverCall");

if(o.status==="new"){
title.textContent="⏳ Жүргізуші ізделуде";
info.textContent="Күте тұрыңыз";
}

if(o.status==="accepted"){
title.textContent="🚕 Жүргізуші табылды!";
info.textContent="Жүргізуші: "+o.driverName;
call.textContent="📞 Жүргізушіге қоңырау";
call.href="tel:"+o.driverPhone;
}

if(o.status==="onway"){
title.textContent="🚗 Көлік жолда!";
info.textContent="Жүргізуші сізге келе жатыр";
}

if(o.status==="arrived"){
title.textContent="📍 КӨЛІК КЕЛДІ!";
info.textContent="Төмен түсіңіз";
}

if(o.status==="cancelled"){
title.textContent="❌ Тапсырыс тоқтатылды";
info.textContent="Қайта тапсырыс бере аласыз";
}

});

}

// ==================================
// ЖҮРГІЗУШІ КІРУ
// ==================================

window.loginDriver=async function(){

const email=document.getElementById("driverEmail").value;
const password=document.getElementById("driverPassword").value;

try{
await signInWithEmailAndPassword(auth,email,password);
}catch(e){
alert("Кіру қатесі: "+e.message);
}

};

window.logoutDriver=async function(){
await signOut(auth);
};

let unsubscribeOrders=null;

onAuthStateChanged(auth,user=>{

if(!isDriver)return;

if(user){

document.getElementById("driverPanel").classList.remove("hidden");
document.getElementById("driverStatus").textContent=
"✅ Жүйеге кірдіңіз";

loadDriverOrders(user);

}else{

document.getElementById("driverPanel").classList.add("hidden");
document.getElementById("driverStatus").textContent=
"Жүйеге кіріңіз";

if(unsubscribeOrders){
unsubscribeOrders();
unsubscribeOrders=null;
}

}

});

// ==================================
// ЖҮРГІЗУШІ ТАПСЫРЫСТАРЫ
// ==================================

function loadDriverOrders(user){

const list=document.getElementById("orders");

unsubscribeOrders=onValue(ordersRef,snap=>{

list.innerHTML="";

if(!snap.exists()){
list.innerHTML="Тапсырыс жоқ";
return;
}

const data=snap.val();

Object.entries(data).reverse().forEach(([id,o])=>{

if(o.status==="cancelled"||o.status==="arrived")return;

const div=document.createElement("div");
div.className="order";

const title=document.createElement("h3");
title.textContent=o.from+" → "+o.to;

const details=document.createElement("p");
details.textContent=
o.price+" тг | "+o.persons
