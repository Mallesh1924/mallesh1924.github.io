<!DOCTYPE html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QOSSHY JOLY</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#f6f6f3}.hero{background:#0f0f0f;color:#fff;padding:24px;text-align:center}.logo{width:88px;height:88px;background:#FFB700;border-radius:22px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:32px;color:#111}.box{background:#fff;border-radius:20px;padding:18px;margin:12px auto;max-width:760px;box-shadow:0 8px 30px rgba(0,0,0,.07)}.input{width:100%;padding:14px;border:2px solid #eee;border-radius:12px;font-size:15px;margin:6px 0;background:#fafafa}.row{display:flex;gap:8px}.row>*{flex:1}.btn{width:100%;padding:16px;border-radius:14px;font-weight:800;border:none;font-size:16px;cursor:pointer;margin-top:8px;display:block;text-align:center;text-decoration:none}.btn-green{background:#25D366;color:#fff}.btn-yellow{background:#FFB700;color:#111}.price{text-align:center;padding:14px;background:#111;color:#fff;border-radius:12px;margin:8px 0}.price b{font-size:28px;color:#FFB700}.order-card{background:#111;color:#fff;border-radius:16px;padding:16px;margin:10px 0;border-left:6px solid #FFB700}.badge{display:inline-block;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:800;margin:2px}.kassa{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.kassa div{background:#222;border-radius:12px;padding:12px;text-align:center}.kassa b{color:#FFB700;font-size:18px;display:block}.kassa span{font-size:10px;color:#aaa}</style></head><body>
<div class="hero"><div class="logo">QJ</div><h1>QOSSHY <span style="color:#FFB700">JOLY</span></h1><p style="color:#aaa;font-size:11px">Қосшы такси • 2 жүргізуші</p></div>

<div id="clientView"><div class="box">
<h3>🚕 Қайда барасыз?</h3>
<div class="row"><select class="input" id="from"><option>Қосшы</option><option>Лесная Поляна</option><option>Тайтөбе</option><option>Астана - Нұрлы Жол</option><option>Астана - Мега</option><option>Астана - Азия Парк</option><option>Астана - Хан Шатыр</option><option>Астана - Есіл</option></select><select class="input" id="to"><option>Астана - Есіл</option><option>Астана - Мега</option><option>Астана - Азия Парк</option><option>Астана - Нұрлы Жол</option><option>Астана - Хан Шатыр</option><option>Қосшы</option><option>Лесная Поляна</option></select></div>
<div class="row"><select class="input" id="persons"><option value="1">👤 1 адам</option><option value="2">👥 2</option><option value="3">👥👤 3</option><option value="4">👥👥 4</option></select><select class="input" id="pay"><option>💵 Қолма-қол</option><option>💳 Kaspi</option></select></div>
<label style="display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0"><input type="checkbox" id="bag" style="width:20px;height:20px"> 🧳 Багаж (+300)</label>
<input type="range" min="500" max="5000" step="100" value="1500" id="r" style="width:100%;accent-color:#FFB700"><div class="price"><b id="pt">1500 тг</b> <span id="pDetail" style="font-size:12px;color:#aaa"></span></div>
<input type="number" class="input" id="p" value="1500"><input type="tel" class="input" id="ph" placeholder="+7 7XX XXX XX XX">
<button class="btn btn-green" onclick="sendOrder()">🟢 Такси шақыру</button>
<p id="status" style="text-align:center;margin-top:12px;font-weight:700;color:#0a6b3c"></p>

<div id="trackBox" style="display:none;background:#111;color:#fff;border-radius:16px;padding:16px;margin-top:12px;text-align:center;border:2px solid #FFB700">
  <div style="font-size:44px" id="trackIcon">⏳</div><h3 id="trackTitle" style="color:#FFB700">⏳ Жүргізуші ізделуде...</h3><p id="trackText" style="font-size:14px;color:#aaa">Тапсырыс жіберілді</p>
  <div style="background:#222;height:10px;border-radius:10px;margin:14px 0;overflow:hidden"><div id="trackBar" style="height:100%;width:15%;background:#FFB700;transition:1s"></div></div>
  <p style="font-size:28px;font-weight:900" id="trackTimer">Күтіңіз</p>
  <a id="trackCall" href="tel:+77087426861" style="display:block;background:#25D366;color:#fff;padding:14px;border-radius:12px;text-decoration:none;margin-top:10px;font-weight:800">📞 Жүргізушіге қоңырау</a>
</div>
</div></div>

<div id="driverView" style="display:none"><div class="box" style="background:#111;color:#fff">
<h3 style="color:#FFB700">👨‍✈️ Жүргізуші беті</h3>
<select id="driverSelect" class="input" style="background:#222;color:#fff"><option value="akzhol">Ақжол - 708 742 68 61</option><option value="driver2">2-ші - 705 662 31 33</option></select>
<div id="loginBox"><input type="password" id="driverPass" class="input" style="background:#222;color:#fff" placeholder="Пароль akzhol2026"><button class="btn btn-yellow" onclick="checkPass()">Кіру</button></div>
<div id="driverPanel" style="display:none">
<div class="kassa"><div><b id="kTodayCount">0</b><span>БҮГІН</span></div><div><b id="kTodaySum">0 тг</b><span>ТАБЫС</span></div><div><b id="kTotalSum">0 тг</b><span>БАРЛЫҒЫ</span></div></div>
<div class="row"><button class="btn btn-yellow" onclick="loadOrders(true)">🔄 Жаңарту</button><button class="btn" style="background:#333;color:#fff" onclick="stopAlarm()">🔇 Өшіру</button></div>
</div>
</div><div class="box" id="ordersBox" style="display:none"><h3>📋 Тапсырыстар <span id="orderCount" style="background:#FFB700;color:#111;padding:2px 8px;border-radius:10px;font-size:12px">0</span></h3><div id="ordersList" style="margin-top:10px"></div></div></div>

<script>
const TOPIC='qosshy-joly-akzhol-7087426861';
const DRIVERS={akzhol:'77087426861', driver2:'77056623133'};
const DRIVER_PASS={akzhol:'akzhol2026', driver2:'7056623133'};
const isDriver=new URLSearchParams(location.search).get('driver')!==null;
if(isDriver){document.getElementById('clientView').style.display='none';document.getElementById('driverView').style.display='block';}

let alarmInterval=null,timerInt=null,lastOrderId='',lastClientStatus='',isAlarmOn=false,clientOrderTime=0;

function speakLoud(t){try{speechSynthesis.cancel();}catch(e){} if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(t);u.lang='kk-KZ';u.rate=1;u.volume=1;speechSynthesis.speak(u);}}
function playBeepOnce(){if(isAlarmOn) return; isAlarmOn=true; if(navigator.vibrate) navigator.vibrate([1000,300,1000]); speakLoud('Жаңа тапсырыс!'); setTimeout(()=>{isAlarmOn=false;},6000);}
function stopAlarm(){speechSynthesis.cancel();isAlarmOn=false; if(navigator.vibrate) navigator.vibrate(0);}
function checkPass(){const sel=document.getElementById('driverSelect').value;const pass=document.getElementById('driverPass').value;if(pass===DRIVER_PASS[sel]||pass==='akzhol2026'){document.getElementById('loginBox').style.display='none';document.getElementById('driverPanel').style.display='block';document.getElementById('ordersBox').style.display='block';updateKassaUI();loadOrders(true);setInterval(()=>loadOrders(false),5000);speakLoud('Жүйе қосылды');}else alert('Пароль қате');}
function getKassa(){try{return JSON.parse(localStorage.getItem('qj_kassa')||'{"total":0,"today":0,"todayCount":0,"date":""}')}catch{return {total:0,today:0,todayCount:0,date:""}}}
function saveKassa(k){localStorage.setItem('qj_kassa',JSON.stringify(k));updateKassaUI();}
function updateKassaUI(){const k=getKassa();const todayStr=new Date().toLocaleDateString();if(k.date!==todayStr){k.today=0;k.todayCount=0;k.date=todayStr;saveKassa(k);}document.getElementById('kTodayCount').textContent=k.todayCount;document.getElementById('kTodaySum').textContent=k.today+' тг';document.getElementById('kTotalSum').textContent=k.total+' тг';}
function addToKassa(price){const k=getKassa();const todayStr=new Date().toLocaleDateString();if(k.date!==todayStr){k.today=0;k.todayCount=0;k.date=todayStr;}const p=parseInt(price)||0;k.today+=p;k.total+=p;k.todayCount+=1;saveKassa(k);}

async function sendOrder(){
  const f=document.getElementById('from').value,t=document.getElementById('to').value,price=document.getElementById('p').value,ph=document.getElementById('ph').value,persons=document.getElementById('persons').value,pay=document.getElementById('pay').value,bag=document.getElementById('bag').checked?'Багаж✔':'Багаж✖';
  if(!ph||ph.length<10){alert('Номер жазыңыз!');return}
  clientOrderTime=Date.now();
  localStorage.setItem('qj_my_phone',ph);
  localStorage.setItem('qj_order_time',clientOrderTime);
  localStorage.removeItem('qj_last_client_status');
  lastClientStatus='';
  const msg=`${f}→${t}|${price}|${ph}|${new Date().toLocaleTimeString()}|${persons}адам|${pay}|${bag}|${clientOrderTime}`;
  await fetch('https://ntfy.sh/'+TOPIC+'?title=JANA&priority=max',{method:'POST',body:msg});
  document.getElementById('status').innerHTML='✅ Жіберілді! Күте тұрыңыз...';
  document.getElementById('trackBox').style.display='block';
  document.getElementById('trackTitle').textContent='⏳ Жүргізуші ізделуде...';
  document.getElementById('trackText').textContent=f+' → '+t;
  document.getElementById('trackIcon').textContent='⏳';
  document.getElementById('trackBar').style.width='15%';
  document.getElementById('trackTimer').textContent='Күтіңіз';
  startClientListener();
  Object.values(DRIVERS).forEach((wa,i)=>{setTimeout(()=>window.open(`https://wa.me/${wa}?text=QOSSHY:%20${encodeURIComponent(f+'→'+t+' '+price+'тг '+ph)}`,'_blank'),i*600);});
}

async function loadOrders(force){
  try{
    const res=await fetch('https://ntfy.sh/'+TOPIC+'/json?poll=1'); 
    const text=await res.text(); 
    const lines=text.trim().split('\n').filter(Boolean).reverse();
    const list=document.getElementById('ordersList');
    const orders=[];
    for(let l of lines){
      try{
        const j=JSON.parse(l);
        if(!j.message) continue;
        if(j.message.startsWith('JOLDA')||j.message.startsWith('KELDI')) continue;
        if(j.message.indexOf('→')>-1) orders.push(j);
      }catch(e){}
    }
    document.getElementById('orderCount').textContent=orders.length;
    if(orders.length===0){list.innerHTML='<p style="color:#888;padding:20px;text-align:center">Әзірге тапсырыс жоқ</p>';return;}
    const newestId=orders[0].id||'';
    if(newestId!==lastOrderId && lastOrderId!==''){playBeepOnce();}
    if(force && lastOrderId==='' && orders.length>0){playBeepOnce();}
    lastOrderId=newestId;
    list.innerHTML='';
    orders.slice(0,20).forEach(o=>{
      const p=o.message.split('|');
      const route=p[0]||'Бағыт'; const price=p[1]||'1500'; const phone=p[2]||''; const time=p[3]||''; const persons=p[4]||''; const pay=p[5]||''; const bag=p[6]||'';
      const d=document.createElement('div');d.className='order-card';
      d.innerHTML=`<b>${route}</b> • <span style="color:#FFB700">${price}тг</span><br><span class="badge" style="background:#0a84ff">${persons}</span><span class="badge" style="background:#FFB700;color:#111">${pay}</span><span class="badge" style="background:#444">${bag}</span><br>📞 <a href="tel:${phone}" style="color:#25D366;font-size:18px;font-weight:800">${phone}</a> • ${time}<br><div style="margin-top:12px" class="row"><button onclick="sendStatus('${phone}','jolda','${route}'); addToKassa('${price}'); this.textContent='✅ Жіберілді'; this.disabled=true;" style="background:#FFB700;color:#111;padding:12px;border-radius:10px;border:none;font-weight:800">🟢 Алдым + Жолдамын</button><button onclick="sendStatus('${phone}','keldi','${route}')" style="background:#0a84ff;color:#fff;padding:12px;border-radius:10px;border:none">📍 Келдім</button></div>`;
      list.appendChild(d);
    });
  }catch(e){document.getElementById('ordersList').innerHTML='Қате: '+e;}
}

async function sendStatus(clientPhone, status, route){
  const now=Date.now();
  const body=status==='jolda' ? `JOLDA|${route}|${clientPhone}|${now}` : `KELDI|${route}|${clientPhone}|${now}`;
  await fetch('https://ntfy.sh/'+TOPIC+'?title='+body+'&priority=max',{method:'POST',body:body});
  stopAlarm();
  alert(status==='jolda'?'✅ Жолдамын кетті!':'✅ Келдім кетті!');
}

function startClientListener(){
  const myPhone=localStorage.getItem('qj_my_phone');
  const orderTime=parseInt(localStorage.getItem('qj_order_time')||'0');
  if(!myPhone) return;
  clientOrderTime=orderTime;
  lastClientStatus=localStorage.getItem('qj_last_client_status')||'';
  setInterval(async()=>{
    try{
      const res=await fetch('https://ntfy.sh/'+TOPIC+'/json?poll=1');
      const text=await res.text();
      const lines=text.trim().split('\n').filter(Boolean).reverse();
      for(let l of lines){
        try{
          const j=JSON.parse(l);
          if(!j.message) continue;
          if(j.message===lastClientStatus) continue;
          if(!j.message.includes(myPhone)) continue;
          const parts=j.message.split('|');
          const msgTime=parseInt(parts[parts.length-1]||'0');
          if(msgTime && msgTime < clientOrderTime) continue;
          if(j.message.startsWith('JOLDA')){
            document.getElementById('trackTitle').textContent='🚗 Ақжол жолда!';
            document.getElementById('trackText').textContent='10 минутта жетеді';
            document.getElementById('trackIcon').textContent='🚗💨';
            document.getElementById('trackBar').style.width='65%';
            startTimer(600);
            speakLoud('Көлік жолда');
            lastClientStatus=j.message; localStorage.setItem('qj_last_client_status',j.message); break;
          }
          if(j.message.startsWith('KELDI')){
            document.getElementById('trackTitle').textContent='✅ Көлік келді!';
            document.getElementById('trackText').textContent='Төмен түсіңіз';
            document.getElementById('trackIcon').textContent='📍🚕';
            document.getElementById('trackBar').style.width='100%';
            if(timerInt)clearInterval(timerInt);
            document.getElementById('trackTimer').textContent='КЕЛДІ';
            speakLoud('Көлік келді');
            lastClientStatus=j.message; localStorage.setItem('qj_last_client_status',j.message); break;
          }
        }catch(e){}
      }
    }catch(e){}
  },4000);
}
function startTimer(sec){if(timerInt)clearInterval(timerInt);let s=sec;const el=document.getElementById('trackTimer');timerInt=setInterval(()=>{s--;let m=Math.floor(s/60),ss=s%60;el.textContent=(m<10?'0':'')+m+':'+(ss<10?'0':'')+ss; if(s<=0){clearInterval(timerInt); el.textContent='Жақында';}},1000);}
const r=document.getElementById('r'),p=document.getElementById('p'),pt=document.getElementById('pt'),bagCb=document.getElementById('bag'),pDetail=document.getElementById('pDetail');
function updPrice(){let base=parseInt(p.value)||1500;if(bagCb.checked)base+=300;pt.textContent=base+' тг';pDetail.textContent=bagCb.checked?'+300':'';r.value=p.value;}
r.addEventListener('input',e=>{p.value=e.target.value;updPrice();});p.addEventListener('input',updPrice);bagCb.addEventListener('change',updPrice);
</script></body></html>
