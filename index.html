<!DOCTYPE html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>QOSSHY JOLY</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#f6f6f3}.hero{background:#0f0f0f;color:#fff;padding:24px;text-align:center}.logo{width:88px;height:88px;background:#FFB700;border-radius:22px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:32px;color:#111}.box{background:#fff;border-radius:20px;padding:18px;margin:12px auto;max-width:760px;box-shadow:0 8px 30px rgba(0,0,0,.07)}.input{width:100%;padding:15px;border:2px solid #eee;border-radius:12px;font-size:15px;margin:6px 0;background:#fafafa}.btn{width:100%;padding:16px;border-radius:14px;font-weight:800;border:none;font-size:16px;cursor:pointer;margin-top:8px;display:block;text-align:center;text-decoration:none}.btn-green{background:#25D366;color:#fff}.btn-yellow{background:#FFB700;color:#111}.price{text-align:center;padding:14px;background:#111;color:#fff;border-radius:12px;margin:8px 0}.price b{font-size:30px;color:#FFB700}.order-card{background:#111;color:#fff;border-radius:16px;padding:16px;margin:10px 0;border-left:5px solid #FFB700}</style></head><body>
<div class="hero"><div class="logo">QJ</div><h1>QOSSHY <span style="color:#FFB700">JOLY</span></h1><p style="color:#aaa;font-size:12px" id="topInfo">Қосшы ↔ Астана • Бағаны өзіңіз қойыңыз</p></div>
<div id="clientView"><div class="box"><h3>🚕 Қайда барасыз?</h3><select class="input" id="from"><option>Қосшы</option><option>Лесная Поляна</option><option>Астана - Есіл</option><option>Астана - Хан Шатыр</option><option>Астана - Вокзал</option></select><select class="input" id="to"><option>Астана - Есіл</option><option>Астана - Хан Шатыр</option><option>Қосшы</option><option>Лесная Поляна</option></select><input type="range" min="500" max="5000" step="100" value="1500" id="r" style="width:100%;accent-color:#FFB700"><div class="price"><b id="pt">1500 тг</b></div><input type="number" class="input" id="p" value="1500"><input type="tel" class="input" id="ph" placeholder="Номеріңіз: +7 7XX XXX XX XX"><button class="btn btn-green" onclick="sendOrder()">🟢 Такси шақыру</button><p id="status" style="text-align:center;margin-top:12px;font-size:14px;color:#0a6b3c;font-weight:600"></p></div></div>
<div id="driverView" style="display:none"><div class="box" style="background:#111;color:#fff"><h3 style="color:#FFB700">👨‍✈️ Жүргізуші - Ақжол</h3><div id="loginBox"><input type="password" id="driverPass" class="input" placeholder="Пароль"><button class="btn btn-yellow" onclick="checkPass()">Кіру</button></div><div id="driverPanel" style="display:none"><p style="font-size:12px;color:#aaa">Бетті ашық ұстаңыз!</p><p style="font-size:11px;color:#0f0" id="liveStatus">● LIVE</p><button class="btn btn-yellow" onclick="loadOrders(true)">🔄 Жаңарту</button></div></div><div class="box" id="ordersBox" style="display:none"><div id="ordersList"></div></div></div>
<script>
const TOPIC='qosshy-joly-akzhol-final';const DRIVER_WA='77780959899';const BOSS_WA='77056623133';const isDriver=new URLSearchParams(location.search).get('driver')==='akzhol';if(isDriver){document.getElementById('clientView').style.display='none';document.getElementById('driverView').style.display='block';document.getElementById('topInfo').textContent='Жүргізуші режимі';}
function checkPass(){if(document.getElementById('driverPass').value==='akzhol2026'){document.getElementById('loginBox').style.display='none';document.getElementById('driverPanel').style.display='block';document.getElementById('ordersBox').style.display='block';loadOrders();setInterval(()=>loadOrders(false),4000);try{const es=new EventSource('https://ntfy.sh/'+TOPIC+'/sse');es.onmessage=()=>{loadOrders(false);playBeep();}}catch(e){}}else alert('Пароль қате! akzhol2026');}
async function sendOrder(){const f=document.getElementById('from').value,t=document.getElementById('to').value,price=document.getElementById('p').value,ph=document.getElementById('ph').value;if(!ph||ph.length<10){alert('Номер жазыңыз!');return}const msg=`${f}→${t}|${price}|${ph}|${new Date().toLocaleTimeString()}`;await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:msg});document.getElementById('status').innerHTML=`✅ Жіберілді! Ақжол хабарласады<br><a href="tel:+7${DRIVER_WA}">📞 +7 778 095 9899</a>`;window.open(`https://wa.me/${DRIVER_WA}?text=QOSSHY%20JOLY:%20${f}→${t}%20${price}тг%20Клиент:${ph}`,'_blank');}
async function loadOrders(forceBeep){try{const res=await fetch('https://ntfy.sh/'+TOPIC+'/json?poll=1');const text=await res.text();const lines=text.trim().split('\n').filter(Boolean);const orders=lines.map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(x=>x&&x.message).reverse();const list=document.getElementById('ordersList');if(orders.length===0){list.innerHTML='<p style="color:#888">Әзірге тапсырыс жоқ</p>';return}const old=parseInt(localStorage.getItem('qj_f')||'0');if(orders.length>old){playBeep();localStorage.setItem('qj_f',orders.length)}else if(forceBeep)playBeep();list.innerHTML='';orders.slice(0,30).forEach(o=>{const p=o.message.split('|');if(p.length<3)return;const [route,price,phone,time]=p;const d=document.createElement('div');d.className='order-card';d.innerHTML=`<b>${route}</b> • <span style="color:#FFB700">${price}тг</span><br>📞 <a href="tel:${phone}" style="color:#25D366">${phone}</a> • ${time}<br><div style="margin-top:10px"><a href="https://wa.me/${phone.replace(/\+/g,'')}?text=SALEM!%20OK!%2010%20min" style="background:#25D366;color:#fff;padding:10px 14px;border-radius:10px;text-decoration:none;font-size:13px;display:inline-block;margin:3px">✅ ОК</a><a href="tel:${phone}" style="background:#fff;color:#111;padding:10px 14px;border-radius:10px;text-decoration:none;font-size:13px;display:inline-block;margin:3px">📞 Қоңырау</a></div>`;list.appendChild(d);});}catch(e){}}
function playBeep(){const a=new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');a.play().catch(()=>{});}const r=document.getElementById('r'),p=document.getElementById('p'),pt=document.getElementById('pt');r.addEventListener('input',e=>{pt.textContent=e.target.value+' тг';p.value=e.target.value});p.addEventListener('input',e=>{pt.textContent=e.target.value+' тг';r.value=e.target.value});
</script></body></html>
